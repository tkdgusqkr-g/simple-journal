name = "simple-journal-api"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# Observability
[observability]
enabled = true

# D1 database (SQLite)
[[d1_databases]]
binding = "DB"
database_name = "simple-journal-db"
database_id = "af5e8c42-587c-46de-a3de-eecdb3c24d56"
migrations_dir = "src/db/migrations"

# R2 bucket (object storage for drawings, attachments)
[[r2_buckets]]
binding = "FILES"
bucket_name = "simple-journal-files"

# Durable Objects (CRDT rooms for realtime collab)
[[durable_objects.bindings]]
name = "CRDT_ROOM"
class_name = "CrdtRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CrdtRoom"]

# Vars (non-secret runtime config — visible in dashboard, embedded in script)
[vars]
ENVIRONMENT = "dev"
WEB_ORIGIN = "https://simple-journal.pages.dev"
# Firebase project id is public (also exposed in client SDK config); not a secret.
FIREBASE_PROJECT_ID = "simple-journal-e6196"

# Secrets (only set if/when the Admin SDK is wired up; ID-token verification
# uses the public JWKS and does not need them):
#   FIREBASE_CLIENT_EMAIL
#   FIREBASE_PRIVATE_KEY
