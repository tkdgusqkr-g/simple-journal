name = "simple-journal-api"
main = "src/index.ts"
compatibility_date = "2024-12-18"
compatibility_flags = ["nodejs_compat"]

# Observability
[observability]
enabled = true

# D1 database (SQLite)
[[d1_databases]]
binding = "DB"
database_name = "simple-journal-db"
database_id = "af5e8c42-587c-46de-a3de-eecdb3c24d56"
migrations_dir = "src/db/migrations"

# R2 bucket (object storage for drawings, attachments)
[[r2_buckets]]
binding = "FILES"
bucket_name = "simple-journal-files"

# Durable Objects (CRDT rooms for realtime collab)
[[durable_objects.bindings]]
name = "CRDT_ROOM"
class_name = "CrdtRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CrdtRoom"]

# Vars (non-secret runtime config)
[vars]
ENVIRONMENT = "dev"
WEB_ORIGIN = "https://simple-journal.pages.dev"

# Secrets (set via `wrangler secret put` or GitHub Actions):
#   FIREBASE_PROJECT_ID
#   FIREBASE_CLIENT_EMAIL
#   FIREBASE_PRIVATE_KEY
