name: backend-test

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tsconfig.base.json"
      - ".github/workflows/backend-test.yml"
  pull_request:
    paths:
      - "backend/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tsconfig.base.json"
      - ".github/workflows/backend-test.yml"

jobs:
  test:
    name: typecheck + build dry-run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "./packages/*" build

      - name: Typecheck backend
        run: pnpm --filter "@simple-journal/backend" typecheck

      - name: Wrangler dry-run build
        working-directory: backend
        run: pnpm exec wrangler deploy --dry-run --outdir=dist
