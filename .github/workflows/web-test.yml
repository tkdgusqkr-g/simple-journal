name: web-test

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tsconfig.base.json"
      - ".github/workflows/web-test.yml"
  pull_request:
    paths:
      - "web/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tsconfig.base.json"
      - ".github/workflows/web-test.yml"

jobs:
  test:
    name: typecheck + build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "./packages/*" build

      - name: Typecheck web
        run: pnpm --filter "@simple-journal/web" typecheck

      - name: Build web
        run: pnpm --filter "@simple-journal/web" build
