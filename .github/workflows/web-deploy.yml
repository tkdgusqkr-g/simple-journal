name: web-deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tsconfig.base.json"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "./packages/*" build

      - name: Build web
        run: pnpm --filter "@simple-journal/web" build

      - name: Ensure Pages project exists
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if pnpm exec wrangler pages project list --json | grep -q '"name": *"simple-journal"'; then
            echo "Pages project 'simple-journal' already exists."
          else
            echo "Creating Pages project 'simple-journal'..."
            pnpm exec wrangler pages project create simple-journal --production-branch=main
          fi

      - name: Deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler pages deploy .svelte-kit/cloudflare \
            --project-name=simple-journal \
            --branch=main \
            --commit-message="${{ github.event.head_commit.message || 'manual deploy' }}" \
            --commit-hash="${{ github.sha }}"
