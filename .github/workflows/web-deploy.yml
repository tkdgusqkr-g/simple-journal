name: web-deploy

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "packages/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "tsconfig.base.json"
      - ".github/workflows/web-deploy.yml"
  workflow_dispatch:

concurrency:
  group: web-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter "./packages/*" build

      - name: Build web
        env:
          PUBLIC_FIREBASE_API_KEY: ${{ vars.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ vars.PUBLIC_FIREBASE_APP_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.PUBLIC_FIREBASE_STORAGE_BUCKET }}
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          PUBLIC_ENVIRONMENT: ${{ vars.PUBLIC_ENVIRONMENT || 'dev' }}
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL || '' }}
        run: pnpm --filter "@simple-journal/web" build

      - name: Ensure Pages project exists
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          output=$(pnpm exec wrangler pages project create simple-journal --production-branch=main 2>&1)
          rc=$?
          set -e
          echo "$output"
          if [ $rc -eq 0 ]; then
            echo "::notice::Pages project created"
          elif echo "$output" | grep -qE 'already exists|8000002'; then
            echo "::notice::Pages project already exists — continuing"
          else
            echo "::error::Pages project create failed"
            exit 1
          fi

      - name: Deploy
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_HASH: ${{ github.sha }}
        run: |
          pnpm exec wrangler pages deploy .svelte-kit/cloudflare --project-name=simple-journal --branch=main --commit-hash="$COMMIT_HASH"
